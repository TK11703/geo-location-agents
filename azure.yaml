# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Owns the backend function app and the APIM geo API. The orchestrator agent is a separate azd
# project under orchestrator/, because that one uses the microsoft.foundry infrastructure provider
# and so cannot also emit the custom Bicep this side needs.
name: erdc-agents
metadata:
  template: erdc-agents@1.0.0

infra:
  provider: bicep
  path: infra

services:
  api:
    project: src/ERDC.Agents
    language: dotnet
    host: function

# The specialists call the gateway, which fronts the function app, so they are published only after
# the app has code on it. Agents whose definition is unchanged are skipped by the script itself.
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/Initialize-AzdEnvironment.ps1
  postdeploy:
    shell: pwsh
    run: ./agents/deploy-agents.ps1
