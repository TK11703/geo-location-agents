# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: geo-orchestrator
services:
    ai-project:
        host: azure.ai.project
        # The model deployments belong to the root project's Bicep, which owns the Foundry account
        # they sit on. Declaring them again here would give one resource two owners.
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    geo-orchestrator:
        project: src/geo-orchestrator
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            # azd runs `dotnet publish` locally and zips the output, so the zip is already built.
            # remote_build would make Agent Service look for project sources that are not in the zip,
            # and it fails with [ImageError] Container image not found because no image is produced.
            dependencyResolution: bundled
            entryPoint: geo-orchestrator.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Answers geospatial questions by fanning out to weather, terrain, mobility, and location specialist agents and merging their reports.
        displayName: Geo Orchestrator
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Declared explicitly so the container does not rely on .env, which is not deployed.
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: ${FOUNDRY_PROJECT_ENDPOINT}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
        name: geo-orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
