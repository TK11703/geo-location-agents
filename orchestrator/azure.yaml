# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: geo-orchestrator
services:
    ai-project:
        host: azure.ai.project
        # Mirrors a deployment that already exists on this shared Foundry account so provision is a
        # no-op. Changing any field here would resize a deployment other agents depend on.
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1
                version: "2025-04-14"
              name: gpt-4.1
              sku:
                capacity: 50
                name: GlobalStandard
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    geo-orchestrator:
        project: src/geo-orchestrator
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: geo-orchestrator.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Answers geospatial questions by fanning out to weather, terrain, mobility, and location specialist agents and merging their reports.
        displayName: Geo Orchestrator
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Declared explicitly so the container does not rely on .env, which is not deployed.
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: ${FOUNDRY_PROJECT_ENDPOINT}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
        name: geo-orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
